# Static, assets-only deployment. There is no Worker script: `main` is omitted
# deliberately, which Wrangler allows for assets-only Workers.
#
# The [assets] block is what `wrangler deploy` (Workers) reads. An earlier
# config set only `pages_build_output_dir`, which `wrangler deploy` ignores —
# producing "Missing entry-point to Worker script or to assets directory".
# Both keys are present now so either deploy command works:
#
#   wrangler deploy            → Workers, reads [assets]
#   wrangler pages deploy dist → Pages,   reads pages_build_output_dir
#
# Run `npm run build` first; dist/ is generated and not committed.
name = "quotecraft"
compatibility_date = "2026-08-27"

pages_build_output_dir = "dist"

# dist/ is generated and gitignored, so a clean CI checkout has no assets
# directory at all. Wrangler runs this before deploying, which makes the deploy
# work even if the dashboard's build command is unset. Uses no dependencies —
# build-static.js imports only Node builtins, so it runs without npm install.
[build]
command = "node build-static.js"

[assets]
directory = "./dist"
# Serve dist/404.html for unmatched paths. Not "single-page-application" —
# this is a multi-page static site, not an SPA, so a bad URL should 404
# rather than silently render the landing page.
not_found_handling = "404-page"
