<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Instant Quote</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/assets/theme.css"/>
<style>
  body { background: transparent; padding: 0; }
  .qw { max-width: 940px; margin: 0 auto; padding: 20px; }

  .qw-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
  .qw-head h2 { margin-bottom: 6px; }
  .qw-head p { font-size: 15px; color: var(--ink-600); max-width: 520px; }
  @media (max-width: 520px) { .qw-head { flex-direction: column; align-items: stretch; } .lang-switch { align-self: flex-start; } }

  .qw-grid { display: grid; grid-template-columns: 1fr 330px; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .qw-grid { grid-template-columns: 1fr; } .qw-panel { position: static !important; } }

  .qw-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  .qw-card:last-child { margin-bottom: 0; }
  .qw-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .qw-card-head h3 { font-size: 17px; }
  .qw-card-head .sub { font-size: 12px; color: var(--ink-500); margin-top: 1px; }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 620px) { .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } }

  .mod-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .mod-row:last-child { border-bottom: none; }
  .mod-row .m-label { font-size: 14.5px; font-weight: 500; color: var(--ink-800); }
  .mod-row .m-help { font-size: 11.5px; color: var(--ink-400); margin-top: 2px; }

  .addon-row { display: flex; align-items: center; gap: 13px; padding: 11px 12px; border-radius: var(--radius-xs); cursor: pointer; transition: background .14s var(--ease); }
  .addon-row:hover { background: var(--violet-050); }
  .addon-row.checked { background: var(--violet-050); }
  .addon-row .a-name { flex: 1; font-size: 14px; }
  .addon-row .a-price { font-size: 14px; font-weight: 600; color: var(--ink-700); font-variant-numeric: tabular-nums; }

  /* Result panel — the plum slab */
  .qw-panel {
    position: sticky; top: 20px;
    background: linear-gradient(158deg, var(--violet-700) 0%, var(--ink-900) 100%);
    border-radius: var(--radius); padding: 26px 24px; color: #fff;
    box-shadow: var(--shadow-plum); overflow: hidden;
  }
  .qw-panel::before {
    content: ''; position: absolute; top: -60px; right: -50px;
    width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle, rgba(242,166,90,.26), transparent 68%);
    pointer-events: none;
  }
  .qp-eyebrow { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 8px; }
  .qp-price { font-family: var(--serif); font-size: 46px; line-height: 1.05; letter-spacing: -.02em; transition: opacity .14s var(--ease); }
  .qp-price.flash { opacity: .3; }
  .qp-price.range { font-size: 30px; }
  .qp-note { font-size: 11.5px; color: var(--apricot-400); margin-top: 8px; display: none; }
  .qp-note.show { display: block; }
  .qp-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); padding: 5px 12px; border-radius: 999px; font-size: 11.5px; margin-top: 13px; }
  .qp-custom { display: none; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: var(--radius-xs); padding: 13px; font-size: 12.5px; line-height: 1.55; margin-top: 14px; }

  .qp-sec { margin-top: 20px; padding-top: 17px; border-top: 1px solid rgba(255,255,255,.14); }
  .qp-sec-t { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.48); margin-bottom: 10px; }
  .qp-line { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 12.5px; color: rgba(255,255,255,.8); }
  .qp-line .v { font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .qp-line.disc .v { color: var(--apricot-400); }
  .qp-line.total { margin-top: 9px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.14); font-size: 14px; color: #fff; }
  .qp-line.total .v { font-family: var(--serif); font-size: 19px; }
  .qp-line.best { color: var(--apricot-400); }

  .qp-time { background: rgba(255,255,255,.09); border-radius: var(--radius-xs); padding: 13px; margin-top: 18px; text-align: center; }
  .qp-time .t-l { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.48); margin-bottom: 5px; }
  .qp-time .t-v { font-family: var(--serif); font-size: 23px; }
  .qp-time .t-s { font-size: 10.5px; color: rgba(255,255,255,.5); margin-top: 2px; }

  .qp-cta { width: 100%; margin-top: 18px; }

  /* Lead form */
  .lead-panel { display: none; }
  .lead-panel.open { display: block; }
  .lead-back { background: none; border: none; color: var(--ink-500); font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); }
  .lead-back:hover { color: var(--violet-700); }
  .lead-summary { background: var(--violet-050); border: 1px solid var(--violet-100); border-radius: var(--radius-xs); padding: 14px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  .lead-summary .ls-l { font-size: 11.5px; color: var(--ink-500); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .lead-summary .ls-v { font-family: var(--serif); font-size: 24px; color: var(--ink-900); }

  .thanks { text-align: center; padding: 40px 24px; }
  .thanks .icon-tile { margin: 0 auto 18px; width: 58px; height: 58px; background: var(--sage-100); color: var(--sage-600); }
  .thanks .icon-tile svg { width: 28px; height: 28px; }
  .thanks h3 { margin-bottom: 8px; }
  .thanks p { color: var(--ink-600); max-width: 400px; margin: 0 auto; font-size: 14.5px; }

  .powered { text-align: center; margin-top: 18px; font-size: 11px; color: var(--ink-400); }
  .powered a { color: var(--ink-500); font-weight: 500; }

  .loading { padding: 70px 24px; text-align: center; color: var(--ink-400); }
</style>
</head>
<body>
<div class="qw" id="root">
  <div class="loading">Loading calculator…</div>
</div>
<div class="toast" id="toast"></div>
<script src="/shared/engine.js"></script>
<script src="/widget/widget.js"></script>
</body>
</html>
